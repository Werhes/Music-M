name: Автосборка Music M

on:
  workflow_dispatch:
    inputs:
      namevers:
        description: "Название релиза"
        required: true
        default: "🤖 Автосборка"
      descr:
        description: "Описание релиза"
        required: true
        default: "❌ Описание сборки отсутствует"
      release:
        description: "Выкинуть в релиз?"
        required: true
        default: false
        type: boolean
      prerelease:
        description: "Пререлиз?"
        required: true
        default: true
        type: boolean

  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============ JOB 1: Подготовка и получение версии ============
  prepare:
    runs-on: windows-latest
    outputs:
      VERSION: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Извлечь версию
        id: get_version
        run: |
          $repoName = "${{ github.repository }}".Split('/')[1]
          $csprojPath = "D:\a\$repoName\$repoName\VK UI3\VK UI3.csproj"
          $content = Get-Content -Raw -Path $csprojPath
          if ($content -match '<AppxPackageVersion>\s*([^<]+?)\s*</AppxPackageVersion>') {
            $version = $matches[1].Trim()
          } else {
            throw "AppxPackageVersion не найден в $csprojPath"
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Версия: $version"

  # ============ JOB 2: Сборка EXE (x64) ============
  build_exe_x64:
    needs: prepare
    runs-on: windows-latest
    env:
      Solution_Name_Unpacked: "VK UI3"
      Configuration_unpacked: Unpacked
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Обновить TOKEN_STAT_SLY
        run: |
          $repoName = "${{ github.repository }}".Split('/')[1]
          $content = Get-Content -Path "D:\a\$repoName\$repoName\VK UI3\StaticParams.cs"
          $updatedContent = $content -replace 'Environment.GetEnvironmentVariable\("TOKEN_STAT_SLY"\)', '"${{ secrets.TOKEN_STAT_SLY }}"'
          Set-Content -Path "D:\a\$repoName\$repoName\VK UI3\StaticParams.cs" -Value $updatedContent

      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v2

      - name: Build EXE x64
        run: |
          msbuild "$env:Solution_Name_Unpacked\$env:Solution_Name_Unpacked.csproj" `
            "/p:Configuration=$env:Configuration_unpacked" `
            "/p:Platform=x64" `
            "/p:RuntimeIdentifier=win-x64" `
            /restore `
            /p:DisableRuntimeIdentifierInference=true `
            /p:EnableNETAnalyzers=false `
            /p:WarningLevel=0 `
            /p:TreatWarningsAsErrors=false `
            /clp:ErrorsOnly

      - name: Package build folder x64
        run: |
          $buildDir = Join-Path "$env:Solution_Name_Unpacked\bin" "x64\$env:Configuration_unpacked"
          if (-not (Test-Path $buildDir)) { throw "Папка сборки для x64 не найдена" }
          $zipName = "VK_UI3_x64.zip"
          if (Test-Path $zipName) { Remove-Item $zipName -Force }
          Compress-Archive -Path "$buildDir\*" -DestinationPath $zipName -Force

      - name: Upload EXE x64
        uses: actions/upload-artifact@v4
        with:
          name: EXE_x64
          path: VK_UI3_x64.zip
          retention-days: 30

  # ============ JOB 3: Сборка EXE (x86) ============
  build_exe_x86:
    needs: prepare
    runs-on: windows-latest
    env:
      Solution_Name_Unpacked: "VK UI3"
      Configuration_unpacked: Unpacked
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Обновить TOKEN_STAT_SLY
        run: |
          $repoName = "${{ github.repository }}".Split('/')[1]
          $content = Get-Content -Path "D:\a\$repoName\$repoName\VK UI3\StaticParams.cs"
          $updatedContent = $content -replace 'Environment.GetEnvironmentVariable\("TOKEN_STAT_SLY"\)', '"${{ secrets.TOKEN_STAT_SLY }}"'
          Set-Content -Path "D:\a\$repoName\$repoName\VK UI3\StaticParams.cs" -Value $updatedContent

      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v2

      - name: Build EXE x86
        run: |
          msbuild "$env:Solution_Name_Unpacked\$env:Solution_Name_Unpacked.csproj" `
            "/p:Configuration=$env:Configuration_unpacked" `
            "/p:Platform=x86" `
            "/p:RuntimeIdentifier=win-x86" `
            /restore `
            /p:DisableRuntimeIdentifierInference=true `
            /p:EnableNETAnalyzers=false `
            /p:WarningLevel=0 `
            /p:TreatWarningsAsErrors=false `
            /clp:ErrorsOnly

      - name: Package build folder x86
        run: |
          $buildDir = Join-Path "$env:Solution_Name_Unpacked\bin" "x86\$env:Configuration_unpacked"
          if (-not (Test-Path $buildDir)) { throw "Папка сборки для x86 не найдена" }
          $zipName = "VK_UI3_x86.zip"
          if (Test-Path $zipName) { Remove-Item $zipName -Force }
          Compress-Archive -Path "$buildDir\*" -DestinationPath $zipName -Force

      - name: Upload EXE x86
        uses: actions/upload-artifact@v4
        with:
          name: EXE_x86
          path: VK_UI3_x86.zip
          retention-days: 30

  # ============ JOB 4: Сборка EXE (ARM64) ============
  build_exe_arm64:
    needs: prepare
    runs-on: windows-latest
    env:
      Solution_Name_Unpacked: "VK UI3"
      Configuration_unpacked: Unpacked
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Обновить TOKEN_STAT_SLY
        run: |
          $repoName = "${{ github.repository }}".Split('/')[1]
          $content = Get-Content -Path "D:\a\$repoName\$repoName\VK UI3\StaticParams.cs"
          $updatedContent = $content -replace 'Environment.GetEnvironmentVariable\("TOKEN_STAT_SLY"\)', '"${{ secrets.TOKEN_STAT_SLY }}"'
          Set-Content -Path "D:\a\$repoName\$repoName\VK UI3\StaticParams.cs" -Value $updatedContent

      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v2

      - name: Build EXE ARM64
        run: |
          msbuild "$env:Solution_Name_Unpacked\$env:Solution_Name_Unpacked.csproj" `
            "/p:Configuration=$env:Configuration_unpacked" `
            "/p:Platform=ARM64" `
            "/p:RuntimeIdentifier=win-arm64" `
            /restore `
            /p:DisableRuntimeIdentifierInference=true `
            /p:EnableNETAnalyzers=false `
            /p:WarningLevel=0 `
            /p:TreatWarningsAsErrors=false `
            /clp:ErrorsOnly

      - name: Package build folder ARM64
        run: |
          $buildDir = Join-Path "$env:Solution_Name_Unpacked\bin" "ARM64\$env:Configuration_unpacked"
          if (-not (Test-Path $buildDir)) { throw "Папка сборки для ARM64 не найдена" }
          $zipName = "VK_UI3_ARM64.zip"
          if (Test-Path $zipName) { Remove-Item $zipName -Force }
          Compress-Archive -Path "$buildDir\*" -DestinationPath $zipName -Force

      - name: Upload EXE ARM64
        uses: actions/upload-artifact@v4
        with:
          name: EXE_ARM64
          path: VK_UI3_ARM64.zip
          retention-days: 30

  # ============ JOB 5: Сборка установщика (Setup.exe) ============
  build_installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Setup (installer) single-file
        run: |
          dotnet publish "Setup\Setup.csproj" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:TreatWarningsAsErrors=false `
            -p:WarningLevel=0 `
            -o installer_out

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Setup_Installer
          path: installer_out/Setup.exe
          retention-days: 30

  # ============ JOB: Сборка portable-версии (x64) ============
  build_portable_x64:
    needs: build_exe_x64
    runs-on: windows-latest
    steps:
      - name: Download EXE x64
        uses: actions/download-artifact@v4
        with:
          name: EXE_x64
          path: artifacts/exe_x64

      - name: Prepare portable zip
        run: |
          Copy-Item -Path "artifacts\exe_x64\VK_UI3_x64.zip" -Destination "VK_M_Portable_x64.zip" -Force

      - name: Upload portable x64
        uses: actions/upload-artifact@v4
        with:
          name: VK_M_Portable_x64
          path: VK_M_Portable_x64.zip
          retention-days: 30

  # ============ JOB: Сборка установщиков Inno Setup (x64 / x86 / arm64) ============
  build_inno_installer:
    needs: [prepare, build_exe_x64, build_exe_x86, build_exe_arm64]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            exe_artifact: EXE_x64
            exe_zip: VK_UI3_x64.zip
          - arch: x86
            exe_artifact: EXE_x86
            exe_zip: VK_UI3_x86.zip
          - arch: arm64
            exe_artifact: EXE_ARM64
            exe_zip: VK_UI3_ARM64.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download EXE ${{ matrix.arch }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.exe_artifact }}
          path: artifacts/exe

      - name: Extract app build
        run: |
          Expand-Archive -Path "artifacts\exe\${{ matrix.exe_zip }}" -DestinationPath "app_build" -Force

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile Inno installer ${{ matrix.arch }}
        run: |
          $version = "${{ needs.prepare.outputs.VERSION }}"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe не найден" }
          $srcDir = (Resolve-Path .\app_build).Path
          $outDir = Join-Path (Get-Location) "InstallerOutput"
          & $iscc "Installer\VK_M_installer.iss" "/DSourceDir=$srcDir" "/DMyAppVersion=$version" "/DMyAppOutputDir=$outDir" "/DMyAppArch=${{ matrix.arch }}"
          Get-ChildItem -Path $outDir -Filter "*.exe" | ForEach-Object { Write-Host "Installer: $($_.FullName)" }

      - name: Upload Inno installer ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: VK_M_Setup_${{ matrix.arch }}
          path: InstallerOutput/*.exe
          retention-days: 30

  # ============ JOB 6: Создание релиза (зависит от всех сборок EXE и установщика) ============
  create_release:
    needs: [prepare, build_exe_x64, build_exe_x86, build_exe_arm64, build_installer, build_portable_x64, build_inno_installer]
    runs-on: windows-latest
    if: github.event.inputs.release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Проверить существование релиза
        id: check_release
        run: |
          $version = "${{ needs.prepare.outputs.VERSION }}"
          $headers = @{
            "Authorization" = "token ${{ secrets.TOKEN }}"
            "Accept" = "application/vnd.github.v3+json"
          }
          try {
            $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases" -Headers $headers
            $release = $releases | Where-Object { $_.tag_name -eq $version -and $_.draft -eq $false -and $_.prerelease -eq $false }
            if ($release) {
              Write-Host "Релиз с тегом $version уже существует"
              echo "exists=true" >> $env:GITHUB_OUTPUT
            } else {
              Write-Host "Релиз с тегом $version не найден"
              echo "exists=false" >> $env:GITHUB_OUTPUT
            }
          } catch {
            Write-Host "Ошибка при проверке релизов: $($_.Exception.Message)"
            echo "exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Создать релиз
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.prepare.outputs.VERSION }}
          name: ${{ github.event.inputs.namevers }}
          body: ${{ github.event.inputs.descr }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: false
        if: steps.check_release.outputs.exists == 'false'

      - name: Upload all artifacts to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: artifacts/**/*
          tag: ${{ needs.prepare.outputs.VERSION }}
          overwrite: true
          file_glob: true
        if: steps.check_release.outputs.exists == 'false'

      - name: Отправить сообщение в Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          $version = "${{ needs.prepare.outputs.VERSION }}"
          $releaseUrl = "https://github.com/${{ github.repository }}/releases/tag/$version"
          $message = @"
          <b>🎉 Новый релиз:</b> ${{ github.event.inputs.namevers }}
          <b>📦 Версия:</b> $version
          <b>📝 Описание:</b> ${{ github.event.inputs.descr }}
          <b>🔗 <a href='$releaseUrl'>Ссылка на релиз</a></b>
          "@
          $uri = 'https://api.telegram.org/bot' + '${{ secrets.TELEGRAM_BOT_TOKEN }}' + '/sendMessage'
          $body = @{
              chat_id = '${{ secrets.TELEGRAM_CHAT_ID }}'
              text = $message
              parse_mode = 'HTML'
          }
          $bodyJson = $body | ConvertTo-Json -Compress
          Invoke-RestMethod -Uri $uri -Method Post -Body $bodyJson -ContentType 'application/json'
        if: steps.check_release.outputs.exists == 'false'